<div class="text-center mb-4">
    <i class="bi bi-shield-lock display-3 text-primary"></i>
    <h2 class="fw-bold mt-3">Administrator Login</h2>
    <p class="text-muted">
        Government Officer Access Portal
    </p>
</div>

<form method="POST">

    <div class="mb-3">
        <label class="form-label fw-semibold">Admin Username</label>

        <input
            type="text"
            class="form-control"
            name="username"
            placeholder="Enter admin username"
            required
        >
    </div>

    <div class="mb-4">
        <label class="form-label fw-semibold">Password</label>

        <input
            type="password"
            class="form-control"
            name="password"
            placeholder="Enter password"
            required
        >
    </div>

    <button type="submit" class="btn btn-admin w-100">
        <i class="bi bi-box-arrow-in-right"></i> Login as Administrator
    </button>

</form>

<div class="text-center mt-4">
    <a href="/" class="home-link">
        <i class="bi bi-arrow-left"></i> Return to Home Page
    </a>
</div>
