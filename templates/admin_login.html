<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
</head>
<body style="font-family:Arial; text-align:center; margin-top:80px;">

    <h1>Admin Login</h1>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Admin Username"
            required
        >

        <br><br>

        <input
            type="password"
            name="password"
            placeholder="Admin Password"
            required
        >

        <br><br>

        <button type="submit">Login</button>

    </form>

    <br>

    <a href="/">Back to Home</a>

</body>
</html>
